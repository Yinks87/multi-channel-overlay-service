# VPS NGINX Konfiguration für weboverlayhosting.duckdns.org
# Pfad: /etc/nginx/sites-available/weboverlayhosting.duckdns.org
# Symlink: ln -s /etc/nginx/sites-available/weboverlayhosting.duckdns.org /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name weboverlayhosting.duckdns.org;

    # HTTP → HTTPS Redirect (wenn SSL via certbot eingerichtet ist)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name weboverlayhosting.duckdns.org;

    # SSL-Zertifikate (von certbot/Let's Encrypt automatisch befüllt)
    ssl_certificate     /etc/letsencrypt/live/weboverlayhosting.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weboverlayhosting.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Backend-Routen (Port 4005) ────────────────────────────────────────

    # REST API
    location /api/ {
        proxy_pass         http://127.0.0.1:4005;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Overlay-Dateien die der Backend-Server ausliefert
    location /overlay-service/ {
        proxy_pass         http://127.0.0.1:4005;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SSE (Server-Sent Events) – Buffering muss deaktiviert sein
    location /clients {
        proxy_pass             http://127.0.0.1:4005;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     3600s;
        chunked_transfer_encoding on;
    }

    # ── Frontend (Port 3005) ──────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3005;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
