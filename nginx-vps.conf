# VPS NGINX Configuration for weboverlayhosting.duckdns.org
# Path: /etc/nginx/sites-available/weboverlayhosting
# Symlink: ln -s /etc/nginx/sites-available/weboverlayhosting /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name weboverlayhosting.duckdns.org;

    # HTTP → HTTPS Redirect (if SSL is configured via Certbot)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name weboverlayhosting.duckdns.org;

    # SSL certificates (automatically populated by Certbot/Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/weboverlayhosting.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weboverlayhosting.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Backend Routes (Port 4005) ────────────────────────────────────────

    # REST API
    location /api/ {
        proxy_pass         http://127.0.0.1:4005;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Overlay files served by the backend server
    location /overlay-service/ {
        proxy_pass         http://127.0.0.1:4005;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SSE (Server-Sent Events) – buffering must be disabled
    location /clients {
        proxy_pass             http://127.0.0.1:4005;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     3600s;
        chunked_transfer_encoding on;
    }

    # ── Frontend (Port 3005) ──────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3005;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
