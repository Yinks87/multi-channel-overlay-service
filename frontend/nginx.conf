server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API + Twitch OAuth callback
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Overlay static files
    location /overlay-service/ {
        proxy_pass http://backend:3000/overlay-service/;
        proxy_set_header Host $host;
    }

    # SSE endpoint — buffering must be disabled
    location /clients {
        proxy_pass http://backend:3000/clients;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }
}
