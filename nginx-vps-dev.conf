# VPS NGINX Configuration for overlaytest.duckdns.org (development)
# Path: /etc/nginx/sites-available/overlaytest
# Symlink: ln -s /etc/nginx/sites-available/overlaytest /etc/nginx/sites-enabled/
#
# Before deploying, obtain an SSL cert:
#   certbot --nginx -d overlaytest.duckdns.org

server {
    listen 80;
    server_name overlaytest.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name overlaytest.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/overlaytest.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/overlaytest.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://yinks87.duckdns.org:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
